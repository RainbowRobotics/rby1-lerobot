[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rby1_xr_teleop"
version = "0.3.1"
description = "XR teleoperation core for the Rainbow Robotics RB-Y1 (framework independent: NumPy / SciPy only)"
readme = "README.md"
authors = [
  { name = "Jinseok Kim", email = "jinseok.kim@rainbow-robotics.com" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["teleoperation", "rby1", "rainbow-robotics", "xr", "vr", "robotics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "scipy",
]

[project.urls]
Homepage = "https://github.com/RainbowRobotics/rby1-lerobot"
Repository = "https://github.com/RainbowRobotics/rby1-lerobot"
Issues = "https://github.com/RainbowRobotics/rby1-lerobot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["rby1_xr_teleop*"]
exclude = ["*.egg-info"]
